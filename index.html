<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <meta name="description" content="Cloudflare IP 在线测试工具">
  <title>Cloudflare IP 在线测试工具</title>
  <link href="https://unpkg.com/tabulator-tables@4.7.2/dist/css/tabulator_site.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
  <script type="text/javascript" src="https://unpkg.com/jquery@3.5.1/dist/jquery.js"></script>
  <script type="text/javascript" src="https://unpkg.com/tabulator-tables@4.7.2/dist/js/tabulator.min.js"></script>
  <style>
    .table.panel .col { margin-bottom: 10px; }
    #generate-v4, #generate-v6 { width: 60px; }
    #stop-test {
      background-color: #e74c3c !important;
      color: white !important;
      border-color: #c0392b !important;
    }
    #stop-test:hover { background-color: #c0392b !important; }
    .line .button { margin-left: 2px; }
  </style>
</head>

<body>

  <h1>Cloudflare IP 在线测试工具</h1>

  <div class="table panel">
    <div class="line">
      <div class="col">
        <button class="button big" id="generate-ip">生成IP数量</button>
        <div class="line" style="font-size: 14px; align-self: center;">
          v4: <input id="generate-v4" class="border" type="number" value="200" min="0" max="5000"></input>
          v6: <input id="generate-v6" class="border" type="number" value="0" min="0" max="5000"></input>
          <span style="margin-left: 5px;">个</span>
        </div>
      </div>

      <div class="col">
        <button class="button big" id="select-all" status=0>选择所有IP</button>
        <div class="line">
          <input id="select-number" class="border" type="number" value="20" min="1" max="100"></input>
          <button class="button" id="select-random"> 随机选 </button>
        </div>
      </div>

      <div class="col">
        <button class="button big" id="test-respond" status=0>响应时间测试</button>
        <div class="line">
          <select id="img-select" class="border">
            <option value="0">115KB</option>
            <option value="1" selected="selected">1.20MB</option>
            <option value="2">10.4MB</option>
          </select>
          <button class="button" id="test-speed"> 网速测试 </button>
          <button class="button" id="stop-test"> 停止测试 </button>
        </div>
      </div>
    </div>
  </div>

  <div id="main-table"></div>
  <div class="panel bottom">
    <div class="button" id="download" status=0>导出成果为CSV文件</div>
  </div>
  <p>首次响应通常比较慢，请多发送几次响应</p>
  <p>如果浏览器强制SSL，则该测试功能无法使用</p>
  <p>基于TulvL大佬的项目改进，<a href="https://github.com/TulvL/cloudflare-ip-tester">TulvL大佬Github项目主页</a> ，感谢TulvL大佬提供的思路！</p>
  <p>本人项目地址 <a href="https://github.com/Humetea/cloudflare-ip-tester">Github地址</a> ，欢迎提出意见！</p>
  <script type="text/javascript" src="/script.js"></script>

  <script>
    var stopTest = false; 
    var respondTimeouts = []; 
    var currentXHR = null; 

    function ipToInt(ip) { return ip.split('.').reduce((res, item) => (res << 8) + parseInt(item), 0) >>> 0; }
    function intToIp(int) { return [(int >>> 24) & 0xff, (int >>> 16) & 0xff, (int >>> 8) & 0xff, int & 0xff].join('.'); }

    function generateCloudflareIPs(v4count, v6count) {
        let selectedIPs = [];
        
        if (v4count > 0) {
            const v4cidrs = ["103.21.244.0/22", "103.22.200.0/22", "103.31.4.0/22", "104.16.0.0/13", "104.24.0.0/14", "108.162.192.0/18", "131.0.72.0/22", "141.101.64.0/18", "162.158.0.0/15", "172.64.0.0/13", "173.245.48.0/20", "188.114.96.0/20", "190.93.240.0/20", "197.234.240.0/22", "198.41.128.0/17"];
            let allCSubnets = [];
            v4cidrs.forEach(cidr => {
                let [ip, mask] = cidr.split('/');
                let startInt = ipToInt(ip);
                let numIPs = Math.pow(2, 32 - parseInt(mask));
                for (let i = 0; i < numIPs; i += 256) { allCSubnets.push(startInt + i); }
            });
            allCSubnets.sort(() => Math.random() - 0.5);
            let actualV4 = Math.min(v4count, allCSubnets.length * 254);
            for (let i = 0; i < v4count; i++) {
                let baseIpInt = allCSubnets[i % allCSubnets.length];
                selectedIPs.push(intToIp(baseIpInt + Math.floor(Math.random() * 254) + 1));
            }
        }

        if (v6count > 0) {
            const v6cidrs = ["2400:cb00:2049::/48", "2400:cb00:f00e::/48", "2606:4700::/32", "2606:4700:10::/48", "2606:4700:130::/48", "2606:4700:3000::/48", "2606:4700:3001::/48", "2606:4700:3002::/48", "2606:4700:3003::/48", "2606:4700:3004::/48", "2606:4700:3005::/48", "2606:4700:3006::/48", "2606:4700:3007::/48", "2606:4700:3008::/48", "2606:4700:3009::/48", "2606:4700:3010::/48", "2606:4700:3011::/48", "2606:4700:3012::/48", "2606:4700:3013::/48", "2606:4700:3014::/48", "2606:4700:3015::/48", "2606:4700:3016::/48", "2606:4700:3017::/48", "2606:4700:3018::/48", "2606:4700:3019::/48", "2606:4700:3020::/48", "2606:4700:3021::/48", "2606:4700:3022::/48", "2606:4700:3023::/48", "2606:4700:3024::/48", "2606:4700:3025::/48", "2606:4700:3026::/48", "2606:4700:3027::/48", "2606:4700:3028::/48", "2606:4700:3029::/48", "2606:4700:3030::/48", "2606:4700:3031::/48", "2606:4700:3032::/48", "2606:4700:3033::/48", "2606:4700:3034::/48", "2606:4700:3035::/48", "2606:4700:3036::/48", "2606:4700:3037::/48", "2606:4700:3038::/48", "2606:4700:3039::/48", "2606:4700:a0::/48", "2606:4700:a1::/48", "2606:4700:a8::/48", "2606:4700:a9::/48", "2606:4700:a::/48", "2606:4700:b::/48", "2606:4700:c::/48", "2606:4700:d0::/48", "2606:4700:d1::/48", "2606:4700:d::/48", "2606:4700:e0::/48", "2606:4700:e1::/48", "2606:4700:e2::/48", "2606:4700:e3::/48", "2606:4700:e4::/48", "2606:4700:e5::/48", "2606:4700:e6::/48", "2606:4700:e7::/48", "2606:4700:e::/48", "2606:4700:f1::/48", "2606:4700:f2::/48", "2606:4700:f3::/48", "2606:4700:f4::/48", "2606:4700:f5::/48", "2606:4700:f::/48", "2803:f800:50::/48", "2803:f800:51::/48", "2a06:98c1:3100::/48", "2a06:98c1:3101::/48", "2a06:98c1:3102::/48", "2a06:98c1:3103::/48", "2a06:98c1:3104::/48", "2a06:98c1:3105::/48", "2a06:98c1:3106::/48", "2a06:98c1:3107::/48", "2a06:98c1:3108::/48", "2a06:98c1:3109::/48", "2a06:98c1:310a::/48", "2a06:98c1:310b::/48", "2a06:98c1:310c::/48", "2a06:98c1:310d::/48", "2a06:98c1:310e::/48", "2a06:98c1:310f::/48", "2a06:98c1:3120::/48", "2a06:98c1:3121::/48", "2a06:98c1:3122::/48", "2a06:98c1:3123::/48", "2a06:98c1:3200::/48", "2a06:98c1:50::/48", "2a06:98c1:51::/48", "2a06:98c1:54::/48", "2a06:98c1:58::/48"];
            let perCidr = Math.floor(v6count / v6cidrs.length);
            let remainder = v6count % v6cidrs.length;

            v6cidrs.forEach((cidr, index) => {
                let countToGen = perCidr + (index < remainder ? 1 : 0);
                if (countToGen <= 0) return;

                let prefix = cidr.split('::')[0];
                let parts = prefix.split(':');
                let pStr = parts[0] + ":" + parts[1] + ":" + parts[2];

                for (let i = 0; i < countToGen; i++) {
                    let hex = Math.floor(Math.random() * 65535 + 1).toString(16);
                    selectedIPs.push(pStr + ":" + hex + "::1");
                }
            });
        }
        
        return selectedIPs.sort(() => Math.random() - 0.5).join('\n');
    }

    function refreshTable() {
        let v4num = parseInt($("#generate-v4").val()) || 0;
        let v6num = parseInt($("#generate-v6").val()) || 0;
        if (v4num + v6num > 5000) {
            alert("总数不能超过5000个！");
            return;
        }
        idn = 0; 
        if (window.database) { for (var key in database) delete database[key]; }
        tablemake(generateCloudflareIPs(v4num, v6num));
        $("#select-number").attr("max", idn);
    }

    window.speedRecur = function(list, i) {
        if (stopTest || i >= list.length) {
            currentXHR = null;
            table.redraw(true);
            $("#test-speed").prop("disabled", false);
            $("#img-select").prop("disabled", false);
            return;
        }

        if (i == 3) table.redraw(true);

        var one = list[i];
        var id = id = one.id;
        var addr = one.addr;
        var started = window.performance.now();
        
        var http = new XMLHttpRequest();
        currentXHR = http; 

        http.open("GET", addr, true);
        http.loadr = 0;
        http.onloadend = function (e) {
            if (stopTest) return; 
            var rbytes = (e.loaded == 0) ? http.loadr : e.loaded;
            var ended = window.performance.now();
            speedEndCallback(rbytes, ended - started, id);
            speedRecur(list, i + 1);
        };
        http.onprogress = function (e) {
            if (stopTest) return;
            var rbytes = e.loaded;
            http.loadr = rbytes;
            var ended = window.performance.now();
            if (ended - started > 100) speedProgressCallback(rbytes, ended - started, id);
        };
        http.timeout = speedTimeout;
        http.send();
    };

    $("#stop-test").click(function() {
        stopTest = true;
        respondTimeouts.forEach(tid => clearTimeout(tid));
        respondTimeouts = [];
        if (currentXHR) {
            currentXHR.abort();
            currentXHR = null;
        }
        $("#test-respond, #test-speed, #img-select").prop("disabled", false);
        alert("测试已立即强制停止");
    });

    $("#test-respond").off("click").click(function () {
        stopTest = false;
        var selectedRows = table.getSelectedRows();
        if (selectedRows.length > 0) {
            $(this).prop("disabled", true);
            selectedRows.sort(positionSort);
            respondTimeouts = [];
            selectedRows.forEach((row, i) => {
                var one = row.getData();
                var tid = setTimeout(() => {
                    if (stopTest) return;
                    var formattedIp = one.ip.replace(/\./g, "-").replace(/:/g, "-");
                    tcping("//" + formattedIp + urlprefix + pingUrl + "?" + Math.random(), tcpingCallback, one.id);
                }, pingInterval * (i + selectedRows.length / 100));
                respondTimeouts.push(tid);
            });
            setTimeout(() => { table.redraw(true); $(this).prop("disabled", false); }, pingInterval * (selectedRows.length + 2));
        }
    });

    $("#test-speed").click(() => { stopTest = false; });

    $(document).ready(() => {
        setTimeout(refreshTable, 100);
        $("#generate-ip").click(() => { refreshTable(); select_0(); });
    });
  </script>
</body>
</html>
